name: Unpack
on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Push
        run: |
          unzip -o pixsort-src.zip
          rm -rf .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unpack source code" || echo "Nothing to commit"
          git push
