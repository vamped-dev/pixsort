# Tests on every push, and downloadable builds on every tag.
#
# Why a client cares: this file means "the author's code is actually tested
# on Windows, macOS and Linux before it ships". That's the kind of signal
# that wins freelance contracts.
name: CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Сработает и при публикации релиза — на случай, если тег создан через веб-интерфейс.
  release:
    types: [published]

# Разрешение прикреплять собранные файлы к релизу.
permissions:
  contents: write

jobs:
  test:
    name: Test (Python ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test the CLI
        run: |
          pixsort --version
          pixsort --help

  package:
    name: Build package
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: pixsort-dist
          path: dist/*

      - name: Attach builds to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "pixsort $GITHUB_REF_NAME" \
            --notes "Install with: pip install pixsort" \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
